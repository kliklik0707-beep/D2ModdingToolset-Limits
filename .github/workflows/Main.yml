
name: D2ModdingToolset - Build mss32 DLL

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build mss32.dll Win32
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify source files
        shell: pwsh
        run: |
          Write-Host "Checking project files..."

          if (-not (Test-Path "mss32/mss32.vcxproj")) {
            throw "Missing mss32.vcxproj"
          }

          Write-Host "Project found."

      - name: Prepare output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build-output" | Out-Null

          $output = (Resolve-Path "build-output").Path + "\"

          "DLL_OUTPUT=$output" >> $env:GITHUB_ENV

          Write-Host "Output directory: $output"

      - name: Compile DLL
        shell: pwsh
        run: |
          & msbuild "mss32/mss32.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            "/p:DISCIPLES2_PATH=$env:DLL_OUTPUT" `
            "/p:OutDir=$env:DLL_OUTPUT" `
            /v:minimal `
            /bl:build.binlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Show compiled files
        if: success()
        shell: pwsh
        run: |
          Write-Host "Compiled files:"
          Get-ChildItem "build-output" -Recurse |
            Select-Object FullName, Length

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mss32
          path: build-output/*.dll
          if-no-files-found: error
