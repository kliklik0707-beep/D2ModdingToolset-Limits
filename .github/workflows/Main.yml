
name: D2ModdingToolset - Build DLL

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Detect solution configuration
        shell: pwsh
        run: |
          $solution = "mss32/mss32.sln"

          if (-not (Test-Path $solution)) {
            throw "Solution file not found: $solution"
          }

          $content = Get-Content $solution
          $inside = $false
          $configs = @()

          foreach ($line in $content) {
            if ($line -match 'GlobalSection\(SolutionConfigurationPlatforms\)') {
              $inside = $true
              continue
            }

            if ($inside -and $line -match 'EndGlobalSection') {
              break
            }

            if ($inside -and $line -match '^\s*(.+?)\|(.+?)\s*=') {
              $configs += [PSCustomObject]@{
                Configuration = $Matches[1].Trim()
                Platform = $Matches[2].Trim()
              }
            }
          }

          Write-Host "Available configurations:"
          $configs | Format-Table | Out-String | Write-Host

          $selected = $configs |
            Where-Object { $_.Configuration -eq "Release" } |
            Select-Object -First 1

          if (-not $selected) {
            throw "No Release configuration found."
          }

          "BUILD_CONFIG=$($selected.Configuration)" >> $env:GITHUB_ENV
          "BUILD_PLATFORM=$($selected.Platform)" >> $env:GITHUB_ENV

          Write-Host "Selected: $($selected.Configuration)|$($selected.Platform)"

      - name: Compile DLL
        shell: pwsh
        run: |
          $arguments = @(
            "mss32/mss32.sln"
            "/m"
            "/p:Configuration=$env:BUILD_CONFIG"
            "/p:Platform=$env:BUILD_PLATFORM"
            "/v:minimal"
            "/bl:build.binlog"
          )

          & msbuild @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mss32
          path: |
            **/Release/*.dll
            **/x86/Release/*.dll
          if-no-files-found: warn
