
name: D2ModdingToolset - Build mss32 DLL

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build mss32.dll Win32
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build-output" | Out-Null
          New-Item -ItemType Directory -Force "mss32/Lib" | Out-Null

          $output = (Resolve-Path "build-output").Path + "\"
          "DLL_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Build SLikeNet
        shell: pwsh
        run: |
          & msbuild "SLikeNet/Lib/LibStatic/LibStatic.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "SLikeNet build failed"
          }


      - name: Build ScenarioGenerator
        shell: pwsh
        run: |
          $solutionDir = (Resolve-Path "mss32").Path + "\"

          Write-Host "SolutionDir: $solutionDir"

          if (-not (Test-Path "mss32/includePath.props")) {
            throw "Missing mss32/includePath.props"
          }

          & msbuild "D2RSG/ScenarioGenerator/ScenarioGenerator.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            "/p:SolutionDir=$solutionDir" `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "ScenarioGenerator build failed"
          }



      - name: Verify libraries
        shell: pwsh
        run: |
          Write-Host "=== Searching for compiled libraries ==="

          Get-ChildItem -Path . -Filter "*.lib" -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $expectedDir = "mss32/Lib"
          New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null

          $names = @(
            "SLikeNet_LibStatic_Release_Win32.lib"
            "ScenarioGenerator_Release_Win32.lib"
          )

          foreach ($name in $names) {
            $target = Join-Path $expectedDir $name

            if (Test-Path $target) {
              Write-Host "Found: $target"
              continue
            }

            $source = Get-ChildItem -Path . -Filter $name -Recurse -File |
              Where-Object { $_.FullName -ne (Join-Path (Resolve-Path $expectedDir).Path $name) } |
              Select-Object -First 1

            if (-not $source) {
              throw "Library was not generated: $name"
            }

            Copy-Item -LiteralPath $source.FullName -Destination $target -Force
            Write-Host "Copied: $($source.FullName) -> $target"
          }

          Write-Host "All required libraries found."


          foreach ($library in $libraries) {
            if (-not (Test-Path $library)) {
              throw "Missing library: $library"
            }

            Write-Host "Found: $library"
          }

      - name: Compile DLL
        shell: pwsh
        run: |
          & msbuild "mss32/mss32.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            "/p:DISCIPLES2_PATH=$env:DLL_OUTPUT" `
            "/p:OutDir=$env:DLL_OUTPUT" `
            /v:minimal `
            /bl:build.binlog

          if ($LASTEXITCODE -ne 0) {
            throw "DLL compilation failed"
          }

      - name: Show compiled files
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem "build-output" -Recurse |
            Select-Object FullName, Length

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mss32
          path: build-output/*.dll
          if-no-files-found: error
