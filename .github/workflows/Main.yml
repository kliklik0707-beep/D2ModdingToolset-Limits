
name: D2ModdingToolset - Build DLL

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Detect solution configuration
        shell: pwsh
        run: |
          $solution = "mss32/mss32.sln"

          if (-not (Test-Path $solution)) {
            throw "Solution file not found: $solution"
          }

          $content = Get-Content $solution
          $inside = $false
          $configs = @()

          foreach ($line in $content) {
            if ($line -match 'GlobalSection\(SolutionConfigurationPlatforms\)') {
              $inside = $true
              continue
            }

            if ($inside -and $line -match 'EndGlobalSection') {
              break
            }

            if ($inside -and $line -match '^\s*(.+?)\|(.+?)\s*=') {
              $configs += [PSCustomObject]@{
                Configuration = $Matches[1].Trim()
                Platform = $Matches[2].Trim()
              }
            }
          }

          Write-Host "Available configurations:"
          $configs | Format-Table | Out-String | Write-Host

          $selected = $configs |
            Where-Object { $_.Configuration -eq "Release" } |
            Select-Object -First 1

          if (-not $selected) {
            throw "No Release configuration found."
          }

          "BUILD_CONFIG=$($selected.Configuration)" >> $env:GITHUB_ENV
          "BUILD_PLATFORM=$($selected.Platform)" >> $env:GITHUB_ENV

          Write-Host "Selected: $($selected.Configuration)|$($selected.Platform)"


      - name: Inspect mss32 project configurations
        shell: pwsh
        run: |
          $project = "mss32/mss32.vcxproj"
          [xml]$xml = Get-Content $project

          Write-Host "=== Available project configurations ==="
          $xml.Project.ItemGroup.ProjectConfiguration |
            ForEach-Object {
              Write-Host $_.Include
            }

          Write-Host "=== Output directories ==="
          $xml.Project.PropertyGroup |
            Where-Object { $_.Condition -or $_.OutDir } |
            ForEach-Object {
              Write-Host "Condition: $($_.Condition)"
              Write-Host "OutDir: $($_.OutDir)"
              Write-Host "ConfigurationType: $($_.ConfigurationType)"
            }

      - name: Compile DLL
        shell: pwsh
        run: |
          & msbuild "mss32/mss32.sln" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /bl:build.binlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }


      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mss32
          path: |
            **/Release/*.dll
            **/x86/Release/*.dll
          if-no-files-found: warn
