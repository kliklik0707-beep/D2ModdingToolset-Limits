

name: D2ModdingToolset - Build DLL Win32

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build mss32.dll
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify project files
        shell: cmd
        run: |
          echo Checking repository...
          echo Branch: %GITHUB_REF_NAME%
          dir mss32

          if not exist "mss32\mss32.sln" exit /b 1
          if not exist "mss32\mss32.vcxproj" exit /b 1

          echo Project files found!

      - name: Compile DLL
        shell: cmd
        run: |
          msbuild "mss32\mss32.sln" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /bl:build.binlog

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mss32
          path: |
            **/Release/mss32.dll
            **/Release/Mss32.dll
          if-no-files-found: error
